<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mob - Minecraft Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    .mob-detail-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1rem;
      align-items: start;
    }
    .mob-detail-grid .mob-preview-wrap {
      width: 100%;
      height: 340px;
      position: relative;
    }
    .mob-detail-grid .mob-preview-wrap canvas {
      width: 100%;
      height: 100%;
    }
    .mob-detail-meta h1 {
      font-size: 15px;
      color: var(--mc-yellow);
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 #000;
      margin-bottom: 0.4rem;
    }
    .mob-detail-meta .mob-category {
      display: inline-block;
      font-size: 9px;
      text-transform: uppercase;
      padding: 3px 10px;
      border: 2px solid var(--mc-btn-dark);
      border-color: var(--mc-btn-light) var(--mc-btn-dark) var(--mc-btn-dark) var(--mc-btn-light);
      background: var(--mc-panel);
      color: var(--mc-text);
      letter-spacing: 1px;
      margin-bottom: 0.8rem;
    }
    .mob-detail-meta .mob-emoji { font-size: 42px; }
    .mob-stat { display: flex; gap: 6px; align-items: center; margin-bottom: 0.3rem; font-size: 10px; color: var(--mc-text); }
    .mob-stat .label { color: var(--mc-text-dark); }
    .mob-desc-box {
      background: #000;
      border: 2px solid var(--mc-btn-dark);
      padding: 0.8rem;
      font-size: 10px;
      line-height: 1.5;
      color: var(--mc-text);
    }
    .mob-back { margin-top: 1rem; }
    @media (max-width: 820px) {
      .mob-detail-grid { grid-template-columns: 1fr; }
      .mob-detail-grid .mob-preview-wrap { height: 260px; }
    }
  </style>
</head>
  <body class="mc-theme">
  <canvas id="bg-canvas"></canvas>

  <header class="mc-header">
    <div class="logo-container">
      <h1 class="mc-logo">MINECRAFT HUB</h1>
      <span class="splash-text">NOVAS ATUALIZAÇÕES!</span>
    </div>
    <nav class="mc-nav">
      <a href="index.html"><button type="button" class="mc-tab">[HOME]</button></a>
      <a href="index.html#skins"><button type="button" class="mc-tab">[SKINS]</button></a>
      <a href="index.html#mobs"><button type="button" class="mc-tab active">[MOBS]</button></a>
      <a href="index.html#mods"><button type="button" class="mc-tab">[MODS]</button></a>
    </nav>
  </header>

  <main id="app-content">
    <section id="tab-mobs" class="tab-content active">
      <div class="section-header">
        <h2>DETALHES DO MOB</h2>
      </div>
      <div class="mc-panel" id="mob-detail-root">
        <div id="mob-detail-error" style="display:none;color:var(--mc-red);font-size:12px;">
          Mob não encontrado. <a href="index.html#mobs">Voltar para os mobs</a>.
        </div>

        <div class="mob-detail-grid" id="mob-detail-grid" style="display:none;">
          <!-- coluna 1: preview 3D -->
          <div class="mob-preview-wrap">
            <canvas id="mob-detail-canvas"></canvas>
            
          </div>

          <!-- coluna 2: detalhes -->
          <div class="mob-detail-meta">
            <div class="mob-card-header" style="margin-bottom:0.8rem;">
              <span class="mob-emoji-small" id="mob-detail-emoji"></span>
              <h1 id="mob-detail-title" style="margin:0;"></h1>
              <span class="mob-category-badge" id="mob-detail-category"></span>
            </div>

            <div class="mob-stat"><span class="label">Bioma:</span> <span id="mob-detail-biome"></span></div>
            <div class="mob-stat"><span class="label">Categoria:</span> <span id="mob-detail-cat-name"></span></div>
            <div class="mob-stat"><span class="label">Nível de Ameaça:</span>
              <span class="mob-threat" id="mob-detail-threat"></span>
            </div>
            <div class="mob-stat" id="mob-detail-threatbar"></div>

            <div class="mob-desc-box" id="mob-detail-desc"></div>

            <div id="mob-detail-drops-wrap"></div>

            <div class="mob-back">
              <a href="index.html#mobs"><button type="button" class="mc-btn">← VOLTAR AOS MOBS</button></a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="mc-footer">
    <div class="footer-left">
      <span class="footer-copy">©Mojang AB. Marcas registradas de seus respectivos proprietários.</span>
    </div>
    <div class="footer-right">
      <span class="footer-version">v1.17.30 / v.L28.12 Hub Ver 2.1</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skinview3d@3.4.2/bundles/skinview3d.bundle.js"></script>
  <script src="js/mob3d.data.js"></script>
  <script src="js/mob3d.tex.js"></script>
  <script src="js/mob3d.js"></script>
  <script src="js/app.js"></script>
  <script src="js/mob-detail.js"></script>
</body>
</html>
